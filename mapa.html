   "Premium solo admite LRS y ZRS. Y la secundaria nunca usa zonas: siempre es LRS."]},
 gob:{n:"Gobierno de la empresa",nodos:["mg","sub","rg","vm","policy","rbac","locks","tags","cost","advisor","arc","oficina"],
  ar:[["mg","sub"],["sub","rg"],["rg","vm"],["policy","mg"],["rbac","sub"],["locks","rg"],["tags","cost"],["sub","cost"],["advisor","vm"],["arc","oficina"]],
  pasos:["Grupos de administración → suscripciones → grupos de recursos → recursos.","Azure Policy asignada arriba se hereda hacia abajo: define cómo deben ser los recursos.","RBAC define quién puede hacer qué en cada ámbito.","Un lock en el grupo de recursos impide borrar o modificar, incluso al Propietario.","Las etiquetas y la suscripción permiten ver el gasto en Cost Management; Advisor sugiere ahorros.","Azure Arc lleva todo esto a servidores fuera de Azure."]}
};
const VS={
 vpner:{n:"VPN Gateway vs ExpressRoute",a:"vpn",b:"er",ta:"Túnel cifrado que viaja por Internet público. S2S para la oficina, P2S para un dispositivo.",tb:"Conexión privada a través de un proveedor: no pasa por Internet. Más rendimiento y menos latencia.",p:"Si el enunciado dice \"no puede pasar por Internet\" → ExpressRoute. Si dice \"cifrado por Internet\" o \"trabajador remoto\" → VPN."},
 adentra:{n:"AD local vs Entra ID",a:"adlocal",b:"entra",ta:"Directorio en servidores locales: Kerberos, NTLM, LDAP, equipos unidos al dominio.",tb:"Identidad en la nube para apps web, móviles, Microsoft 365 y Azure.",p:"NO son lo mismo. Se unen con Entra Connect. Para apps antiguas con Kerberos en Azure: Entra Domain Services."},
 polrbac:{n:"Azure Policy vs RBAC",a:"policy",b:"rbac",ta:"Reglas sobre cómo deben ser los recursos: regiones, etiquetas, tamaños.",tb:"Quién puede hacer qué y dónde: entidad de seguridad + rol + ámbito.",p:"\"Solo se pueden crear recursos en Brazil South\" → Policy. \"Ana solo puede ver\" → RBAC. \"Que nadie pueda borrarlo\" → Lock."},
 sepe:{n:"Endpoint de servicio vs endpoint privado",a:"se",b:"pe",ta:"La subred llega al servicio por la red de Microsoft, pero el endpoint público sigue existiendo y no sirve desde local.",tb:"IP privada en tu VNet para un recurso; llega también desde la oficina por VPN/ExpressRoute; puedes apagar el acceso público.",p:"\"Acceder desde la oficina por IP privada\" o \"desactivar el acceso público\" → endpoint privado."},
 fd:{n:"Files vs Disks",a:"files",b:"disks",ta:"Carpeta compartida que se monta por SMB/NFS: VMs, PCs de la oficina, contenedores, App Service.",tb:"Disco administrado que solo se conecta a VMs.",p:"Disks se conecta (a una VM). Files se monta (en cualquier lado)."},
 tmfd:{n:"Traffic Manager vs Front Door",a:"tm",b:"fd",ta:"Global, solo DNS: le dice al cliente a qué región ir y el tráfico va directo. Cualquier protocolo. Sin WAF ni caché.",tb:"Global, capa 7 (HTTP/HTTPS): todo el tráfico pasa por él. WAF, caché (CDN), terminación SSL y rutas por URL.",p:"Global + DNS o protocolo no HTTP → Traffic Manager. Global + web con WAF o aceleración → Front Door. Regional + web → Application Gateway. Regional + TCP/UDP → Load Balancer."},
 egsb:{n:"Event Grid vs Service Bus",a:"eventgrid",b:"servicebus",ta:"EVENTOS: avisa que algo pasó (se creó un blob, se borró una VM) a quien esté suscrito. Ligero, reactivo, serverless.",tb:"MENSAJES de negocio que no se pueden perder: colas y temas, orden garantizado, transacciones (un pedido, un pago).",p:"\"Reaccionar cuando ocurre algo\" → Event Grid. \"Mensajes confiables, en orden, entre aplicaciones empresariales\" → Service Bus. Cola simple y barata dentro de una Storage Account → Queue Storage."},
 funclogic:{n:"Functions vs Logic Apps",a:"func",b:"logic",ta:"Escribes CÓDIGO (C#, JavaScript, Python…) que se ejecuta ante un evento.",tb:"Diseñas un FLUJO visual, sin código, con conectores listos (Office 365, Teams, SQL…).",p:"\"Código\" → Functions. \"Sin código\", \"flujo de trabajo\", \"diseñador visual\", \"integrar servicios\" → Logic Apps. Los dos son serverless."},
 mgbp:{n:"Grupo de administración vs Blueprints",a:"mg",b:"blueprints",ta:"DÓNDE se aplican las reglas: árbol de suscripciones; lo asignado (políticas, roles) se hereda hacia abajo.",tb:"QUÉ paquete se desplegaba: plantillas + políticas + roles + grupos de recursos para que un entorno nazca conforme. Retirado.",p:"\"Varias suscripciones\", \"jerarquía\", \"desde un solo lugar\" → grupo de administración. \"Crear entornos conformes de forma repetible\" → Blueprints (hoy Bicep/ARM + Policy)."},
 aish:{n:"Application Insights vs Service Health",a:"ai",b:"sh",ta:"Problemas de TU aplicación web: lentitud, cuellos de botella, errores, comportamiento de los usuarios.",tb:"Problemas de AZURE: caídas y mantenimientos planificados o no que afectan a tus recursos.",p:"\"Mi app está lenta o falla\" → Application Insights. \"Azure tiene un incidente o mantenimiento\" → Service Health. SIEM → Sentinel; consultas KQL → Log Analytics."},
 conds:{n:"Entra Connect vs Entra Domain Services",a:"connect",b:"entrads",ta:"Antes Azure AD Connect. App que instalas en tu oficina y SINCRONIZA las cuentas del AD local (AD DS) hacia Entra ID: misma cuenta en los dos lados (identidad híbrida).",tb:"Antes Azure AD DS. Dominio ADMINISTRADO por Microsoft en Azure, con Kerberos, NTLM y LDAP, para apps antiguas o VMs que deben unirse a un dominio, sin montar controladores. Recibe las cuentas desde Entra ID en una sola vía.",p:"\"Sincronizar el AD local con la nube\" → Entra Connect. \"App legacy con Kerberos/LDAP\" o \"unir VMs a un dominio sin administrar controladores\" → Entra Domain Services. Ojo: AD DS sin \"Azure\" es el Active Directory tradicional en tus servidores."},
 peervpn:{n:"VNet peering vs VPN Gateway",a:"peering",b:"vpn",ta:"VNet ↔ VNet por la red troncal de Microsoft, sin gateways ni túnel: privado, baja latencia. Con peering global, entre regiones.",tb:"Túnel IPsec cifrado: oficina ↔ VNet (S2S) o dispositivo ↔ VNet (P2S). Viaja por Internet y requiere un gateway.",p:"\"Conectar dos VNets\" (aunque estén en otra región) → peering. \"Conectar la oficina o un portátil\" → VPN Gateway. VNet-a-VNet por VPN existe, pero el examen prefiere peering."},
 tensub:{n:"Tenant vs suscripción",a:"tenant",b:"sub",ta:"QUIÉNES: tu organización en Entra ID, con usuarios, grupos y aplicaciones. Uno por organización.",tb:"QUÉ y QUIÉN PAGA: contenedor de recursos con su facturación y sus límites. Una organización puede tener muchas.",p:"Un tenant → muchas suscripciones; una suscripción → un solo tenant. \"Usuarios, identidades, inicio de sesión\" → tenant. \"Facturación, separar entornos o departamentos\" → suscripción."},
 lbagw:{n:"Load Balancer vs Application Gateway",a:"lb",b:"agw",ta:"Capa 4 (TCP/UDP): reparte por IP y puerto.",tb:"Capa 7 (HTTP/HTTPS): rutas por URL (/images, /video), terminación SSL y WAF.",p:"Si menciona URL, HTTPS o WAF → Application Gateway."},
 aciaks:{n:"Container Instances vs AKS",a:"aci",b:"aks",ta:"Un contenedor bajo demanda, lo más simple.",tb:"Orquestación de muchos contenedores con Kubernetes.",p:"\"La forma más simple de ejecutar un contenedor\" → ACI. \"Orquestar\" → AKS. Guardar imágenes → ACR."},
 defsen:{n:"Defender for Cloud vs Sentinel",a:"defender",b:"sentinel",ta:"Postura de seguridad: evalúa, recomienda y alerta sobre tus recursos.",tb:"SIEM: reúne eventos de toda la empresa y detecta amenazas con IA.",p:"\"Recomendaciones de seguridad\" o \"postura\" → Defender. \"SIEM\" o \"recopilar y analizar eventos\" → Sentinel."},
 monsh:{n:"Azure Monitor vs Service Health",a:"monitor",b:"sh",ta:"Observa TUS recursos: métricas, registros, alertas.",tb:"Observa la PLATAFORMA Azure: incidentes y mantenimiento que te afectan.",p:"\"¿Azure tiene una caída?\" → Service Health. \"¿Mi VM usa mucha CPU?\" → Monitor."},
 azpar:{n:"Zonas de disponibilidad vs región emparejada",a:"az",b:"par",ta:"Centros de datos separados DENTRO de la misma región: sobrevives a la caída de uno.",tb:"OTRA región del mismo límite geopolítico: sobrevives a la caída de toda la región.",p:"ZRS = zonas. GRS/GZRS = región emparejada."},
 azexp:{n:"AzCopy vs Storage Explorer",a:"azcopy",b:"explorer",ta:"Línea de comandos, instalada localmente. Ideal para scripts y para programar transferencias.",tb:"Interfaz gráfica de arrastrar y soltar, instalada localmente (Windows, macOS, Linux), para todos los tipos de almacenamiento.",p:"\"Instalada localmente\" descarta el Portal (web). \"GUI\", \"arrastrar y soltar\" o \"fácil de usar\" → Storage Explorer. \"Comandos\", \"script\" o \"programar\" → AzCopy. \"Sincronizar un servidor de archivos\" → File Sync. Instalada + gráfica = Storage Explorer; instalada + comandos = AzCopy; navegador = Portal o Cloud Shell."},
 calccost:{n:"Calculadoras vs Cost Management",a:"calc",b:"cost",ta:"ANTES: estimar (precios) o comparar con tu centro de datos (TCO).",tb:"DURANTE: gasto real, presupuestos, alertas y asignación de costos.",p:"Estimar → calculadora de precios. Comparar con local → TCO. Controlar el gasto real → Cost Management."}
};

const MODOS={explorar:"Explorar servicios",escenarios:"Escenarios",comparar:"Comparar confusiones"};
let modo="explorar",sel=null,esc=null,vs=null;
const byId=Object.fromEntries(N.map(n=>[n[0],n]));
const EXTRA={
 redund:`<div class="tbl"><table><thead><tr><th>Opción</th><th>Primaria</th><th>Secundaria</th><th>Copias</th><th>Sobrevive a</th><th>Leer secundaria</th></tr></thead><tbody>
<tr><td><b>LRS</b></td><td>1 centro de datos</td><td>—</td><td>3</td><td>falla de disco/rack</td><td class="n">—</td></tr>
<tr><td><b>ZRS</b></td><td>3 zonas</td><td>—</td><td>3</td><td>caída de una zona</td><td class="n">—</td></tr>
<tr><td><b>GRS</b></td><td>LRS</td><td>LRS (región emparejada)</td><td>6</td><td>caída de la región (con failover)</td><td class="n">No</td></tr>
<tr><td><b>RA-GRS</b></td><td>LRS</td><td>LRS</td><td>6</td><td>caída de la región</td><td class="y">Sí, siempre</td></tr>
<tr><td><b>GZRS</b></td><td>ZRS</td><td>LRS</td><td>6</td><td>zona y región (con failover)</td><td class="n">No</td></tr>
<tr><td><b>RA-GZRS</b></td><td>ZRS</td><td>LRS</td><td>6</td><td>zona y región</td><td class="y">Sí, siempre</td></tr>
</tbody></table></div><p class="fb"><b>Pista:</b> "Z" = zonas en la primaria · "G" = otra región · "RA-" = leer la secundaria sin failover. Simulador completo en el capítulo 7.</p>`
};
const W=176,H=32,COLX=196,X0=12,Y0=48,STEP=44;
const pos={};
AREAS.forEach((a,i)=>N.filter(n=>n[2]===i).forEach((n,j)=>pos[n[0]]={x:X0+i*COLX,y:Y0+j*STEP}));
const alto=Y0+Math.max(...AREAS.map((a,i)=>N.filter(n=>n[2]===i).length))*STEP+10;
const esc$=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

function ruta(a,b){
  const pa=pos[a],pb=pos[b],ca=byId[a][2],cb=byId[b][2];
  let x1,y1=pa.y+H/2,x2,y2=pb.y+H/2,d;
  if(ca<cb){x1=pa.x+W;x2=pb.x-2;const k=(x2-x1)/2;d=`M${x1},${y1} C${x1+k},${y1} ${x2-k},${y2} ${x2},${y2}`}
  else if(ca>cb){x1=pa.x;x2=pb.x+W+2;const k=(x1-x2)/2;d=`M${x1},${y1} C${x1-k},${y1} ${x2+k},${y2} ${x2},${y2}`}
  else{x1=pa.x+W;x2=pb.x+W+2;const o=28+Math.abs(y2-y1)*.15;d=`M${x1},${y1} C${x1+o},${y1} ${x2+o},${y2} ${x2},${y2}`}
  return{d,mx:(x1+x2)/2+(ca===cb?24:0),my:(y1+y2)/2};
}

function dibujar(activos,aristas){
  const svg=document.getElementById("svg"),Wt=X0+AREAS.length*COLX;
  svg.setAttribute("viewBox",`0 0 ${Wt} ${alto}`);
  const hay=activos&&activos.size;
  const esActiva=(a,b)=>aristas.some(([x,y])=>(x===a&&y===b));
  let s=`<defs>${AREAS.map((a,i)=>`<marker id="m${i}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${a.c}"/></marker>`).join("")}<marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>`;
  s+=AREAS.map((a,i)=>`<text class="col" x="${X0+i*COLX}" y="${a.col?13:26}" fill="${a.c}">${(a.col||[a.n]).map((l,k)=>`<tspan x="${X0+i*COLX}" dy="${k?14:0}">${k?"":(i+1)+" · "}${l}</tspan>`).join("")}</text>`).join("");
  let etiquetas="";
  E.forEach(([a,b,l])=>{
    const r=ruta(a,b),on=hay&&esActiva(a,b),ca=byId[a][2];
    s+=`<path class="e${on?" on":hay?" dim":""}" d="${r.d}" ${on?`style="stroke:${AREAS[ca].c}" marker-end="url(#m${ca})"`:`marker-end="url(#mg)"`}/>`;
    if(on&&modo==="explorar")etiquetas+=`<text class="et" x="${r.mx}" y="${r.my-4}" text-anchor="middle">${esc$(l)}</text>`;
  });
  N.forEach(([id,n,ar])=>{
    const p=pos[id],dim=hay&&!activos.has(id);
    s+=`<g class="n${id===sel?" sel":""}${dim?" dim":""}" data-id="${id}" tabindex="0" role="button" aria-label="${esc$(n)}"><title>${esc$(byId[id][4])}</title><rect class="caja" x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="6"/><rect x="${p.x}" y="${p.y}" width="5" height="${H}" rx="2" fill="${AREAS[ar].c}"/><text x="${p.x+13}" y="${p.y+H/2+4.5}">${esc$(n)}</text></g>`;
  });
  svg.innerHTML=s+etiquetas;
  svg.querySelectorAll(".n").forEach(g=>{
    const go=()=>{modo="explorar";sel=g.dataset.id;render()};
    g.onclick=go;g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}};
  });
}

function linkCap(c){return`<a href="az900/${CAP[c]}">Estudiar en el capítulo ${c} →</a>`}
function botonNodo(id){return`<button type="button" data-ir="${id}">${esc$(byId[id][1])}</button>`}

function render(){
  const m=document.getElementById("modo");m.innerHTML="";
  Object.keys(MODOS).forEach(k=>{const b=document.createElement("button");b.type="button";b.textContent=MODOS[k];b.setAttribute("aria-pressed",String(modo===k));
    b.onclick=()=>{modo=k;if(k==="escenarios"&&!esc)esc="web";if(k==="comparar"&&!vs)vs="vpner";render()};m.appendChild(b)});
  const op=document.getElementById("opciones");op.innerHTML="";
  const lista=modo==="escenarios"?ESC:modo==="comparar"?VS:null;
  const boton=(k,txt,dest)=>{const b=document.createElement("button");b.type="button";b.className="btn";b.textContent=txt;
    b.setAttribute("aria-pressed",String((modo==="escenarios"?esc:vs)===k));
    if((modo==="escenarios"?esc:vs)===k){b.style.borderColor="var(--accent)";b.style.background="var(--accent-soft)"}
    b.onclick=()=>{modo==="escenarios"?esc=k:vs=k;render()};dest.appendChild(b)};
  if(modo==="escenarios")Object.keys(ESC).forEach(k=>boton(k,ESC[k].n,op));
  // Comparaciones agrupadas y numeradas por el área de su primer servicio (igual que las columnas del mapa)
  if(modo==="comparar")AREAS.forEach((a,i)=>{
    const ks=Object.keys(VS).filter(k=>byId[VS[k].a][2]===i);if(!ks.length)return;
    const g=document.createElement("div");g.className="grupo";g.innerHTML=`<span class="gt" style="color:${a.c}">${i+1} · ${a.n}</span><div class="bt"></div>`;
    ks.forEach((k,j)=>boton(k,`${i+1}.${j+1} ${VS[k].n}`,g.lastChild));op.appendChild(g)});
  document.getElementById("leyenda").innerHTML=AREAS.map((a,i)=>`<span><i style="background:${a.c}"></i>${i+1} · ${a.n}</span>`).join("");

  const panel=document.getElementById("panel");
  if(modo==="explorar"){
    if(!sel){dibujar(null,[]);panel.innerHTML=`<h2>Elige un servicio</h2><p>Haz clic en cualquier caja del mapa para ver qué es, con qué se conecta y en qué capítulo se estudia. Las flechas se encienden con su relación.</p>`;}
    else{
      const sal=E.filter(e=>e[0]===sel),ent=E.filter(e=>e[1]===sel);
      const act=new Set([sel,...sal.map(e=>e[1]),...ent.map(e=>e[0])]);
      dibujar(act,[...sal,...ent].map(e=>[e[0],e[1]]));
      const n=byId[sel];
      panel.innerHTML=`<div class="area" style="color:${AREAS[n[2]].c}">${AREAS[n[2]].n}</div><h2>${esc$(n[1])}</h2><p>${esc$(n[4])}</p>${EXTRA[sel]||""}`+
        `<ul class="conex">${sal.map(e=>`<li>${esc$(n[1])} <b>${esc$(e[2])}</b> ${botonNodo(e[1])}</li>`).join("")}${ent.map(e=>`<li>${botonNodo(e[0])} <b>${esc$(e[2])}</b> ${esc$(n[1])}</li>`).join("")}</ul>`+
        `<p>${linkCap(n[3])} · <button type="button" class="btn" id="limpiar">Ver todo el mapa</button></p>`;
      document.getElementById("limpiar").onclick=()=>{sel=null;render()};
    }
  }else if(modo==="escenarios"){
    const x=ESC[esc];sel=null;
    dibujar(new Set(x.nodos),x.ar);
    panel.innerHTML=`<h2>${x.n}</h2><ol class="pasos">${x.pasos.map(p=>`<li>${p}</li>`).join("")}</ol><p class="fb">Servicios del escenario: ${x.nodos.map(botonNodo).join(", ")}</p>`;
  }else{
    const x=VS[vs];sel=null;
    const aristas=E.filter(e=>[x.a,x.b].includes(e[0])||[x.a,x.b].includes(e[1])).map(e=>[e[0],e[1]]);
    const act=new Set(aristas.flat());act.add(x.a);act.add(x.b);
    dibujar(act,aristas);
    const A=byId[x.a],B=byId[x.b];
    panel.innerHTML=`<h2>${x.n}</h2><div class="vs"><div><h3 style="color:${AREAS[A[2]].c}">${esc$(A[1])}</h3><p>${x.ta}</p><p style="margin-top:6px">${linkCap(A[3])}</p></div><div><h3 style="color:${AREAS[B[2]].c}">${esc$(B[1])}</h3><p>${x.tb}</p><p style="margin-top:6px">${linkCap(B[3])}</p></div></div><div class="pista"><b>Pista para el examen:</b> ${x.p}</div>`;
  }
  panel.querySelectorAll("[data-ir]").forEach(b=>b.onclick=()=>{modo="explorar";sel=b.dataset.ir;render()});
}
render();
</script>
</body>
